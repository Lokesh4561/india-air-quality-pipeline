name: Hourly air quality pipeline

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC)
  workflow_dispatch:         # lets you run it manually from the Actions tab
    inputs:
      backfill_days:
        description: "Days of history to load (1-92)"
        default: "1"

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas python-dotenv requests "psycopg[binary]"
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m aq.pipeline --strict --backfill-days "${{ github.event.inputs.backfill_days || '1' }}"
